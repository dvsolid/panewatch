name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  # Separate job, separate runner: GitHub-hosted macOS runners can't run Docker (no nested
  # virtualization), and SwiftLint's Homebrew build can't load sourcekitd on a Command Line
  # Tools-only Mac either (see CLAUDE.md), so this runs the same pinned image contributors use
  # locally on a Linux runner instead.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.0 \
            lint --strict --reporter github-actions-logging
